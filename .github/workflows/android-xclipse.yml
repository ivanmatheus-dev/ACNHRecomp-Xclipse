name: Android Xclipse checks

on:
  pull_request:
  push:
    branches: [main, xclipse-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools bison flex zip
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          "$RUNNER_TEMP/mesa-venv/bin/pip" install meson==1.6.1 ninja==1.13.0 mako==1.3.10 packaging==25.0
          echo "$RUNNER_TEMP/mesa-venv/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
          set -o pipefail
      - name: Fetch pinned headers and UI
        run: |
          mkdir -p private/third_party/imgui
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.357.tar.gz -o "$RUNNER_TEMP/vulkan.tar.gz"
          echo '7dc0dbcf1d49dd3d7da3761c251c6097dfbaac475321a4a8a99269d3d5abecdc  '"$RUNNER_TEMP/vulkan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vulkan.tar.gz" -C private/third_party
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.tar.gz -o "$RUNNER_TEMP/imgui.tar.gz"
          echo '3872a5f90df78fced023c1945f4466b654fd74573370b77b17742149763a7a7c  '"$RUNNER_TEMP/imgui.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/imgui.tar.gz" --strip-components=1 -C private/third_party/imgui
      - name: Build RADV Xclipse
        run: tools/build_radv_xclipse.sh
      - name: Build unsigned app without game files
        run: tools/build_android.sh --no-game --unsigned --require-radv --jobs 2
      - name: Check APK metadata and native alignment
        run: |
          apk=private/acnh/apk-app/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='io.github.ivanmtdev.acnhrecomp'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          test -f private/acnh/apk-app/lib/arm64-v8a/libvulkan_radeon.so
          for lib in private/acnh/apk-app/lib/arm64-v8a/*.so; do
            "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$lib" | grep 'AArch64'
            "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW "$lib" | \
              awk '$1 == "LOAD" { n++; if ($NF != "0x4000" && $NF != "0x10000") exit 1 } END { if (!n) exit 1 }'
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xclipse-unsigned-check-apk
          path: private/acnh/apk-app/aligned.apk
          if-no-files-found: error
          retention-days: 7

  standalone-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test driver policy and cache identity
        run: |
          c++ -std=c++20 -Iruntime/src tests/android_driver_policy_test.cpp -o /tmp/driver-policy
          /tmp/driver-policy
          c++ -std=c++20 -Iruntime/src/nvn tests/pipeline_cache_identity_test.cpp -o /tmp/cache-identity
          /tmp/cache-identity
      - name: Test GPU selection and texture layout
        run: |
          c++ -std=c++20 -DNX_GPU_PICK_STANDALONE -Iruntime/src/nvn tests/gpu_pick_test.cpp runtime/src/nvn/nvn_gpu_pick.cpp -o /tmp/gpu-pick
          /tmp/gpu-pick
          c++ -std=c++20 -Iruntime/src/nvn tests/tiling_test.cpp runtime/src/nvn/nvn_tiling.cpp -o /tmp/tiling
          /tmp/tiling --selftest
          c++ -std=c++20 -Iruntime/src/nvn tests/astc_test.cpp runtime/src/nvn/nvn_astc.cpp -o /tmp/astc
          /tmp/astc --selftest
