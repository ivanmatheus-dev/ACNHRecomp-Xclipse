name: Android Xclipse checks

on:
  pull_request:
  push:
    branches: [main, xclipse-android]
    tags: [xclipse-v0.1.0-experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools bison flex zip
          python3 -m venv "$RUNNER_TEMP/mesa-venv"
          "$RUNNER_TEMP/mesa-venv/bin/pip" install meson==1.6.1 ninja==1.13.0 mako==1.3.10 packaging==25.0 PyYAML==6.0.2
          echo "$RUNNER_TEMP/mesa-venv/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
          set -o pipefail
      - name: Fetch pinned headers and UI
        run: |
          mkdir -p private/third_party/imgui
          curl -fsSL https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.357.tar.gz -o "$RUNNER_TEMP/vulkan.tar.gz"
          echo '7dc0dbcf1d49dd3d7da3761c251c6097dfbaac475321a4a8a99269d3d5abecdc  '"$RUNNER_TEMP/vulkan.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/vulkan.tar.gz" -C private/third_party
          curl -fsSL https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9.tar.gz -o "$RUNNER_TEMP/imgui.tar.gz"
          echo '3872a5f90df78fced023c1945f4466b654fd74573370b77b17742149763a7a7c  '"$RUNNER_TEMP/imgui.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/imgui.tar.gz" --strip-components=1 -C private/third_party/imgui
      - name: Fetch pinned RADV source
        run: |
          git clone --no-checkout https://github.com/JimVulkan/radv-xclipse.git private/third_party/radv-xclipse
          git -C private/third_party/radv-xclipse checkout --detach fe9b8943aaeec11ed9fccbfcc382da07379afbe5
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: private/third_party/radv-xclipse/subprojects/packagecache
          key: ${{ runner.os }}-radv-fe9b8943-${{ hashFiles('private/third_party/radv-xclipse/subprojects/*.wrap', 'private/third_party/radv-xclipse/subprojects/packagefiles/*') }}
      - name: Build RADV Xclipse
        run: tools/build_radv_xclipse.sh
      - name: Build unsigned app without game files
        run: tools/build_android.sh --no-game --unsigned --require-radv --jobs 2
      - name: Check APK metadata and native alignment
        run: |
          apk=private/acnh/apk-app/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='io.github.ivanmtdev.acnhrecomp'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          test -f private/acnh/apk-app/lib/arm64-v8a/libvulkan_radeon.so
          python3 tools/verify_android_libs.py --ndk "$ANDROID_HOME/ndk/29.0.14206865" --libdir private/acnh/apk-app/lib/arm64-v8a
      - name: Collect notices and source revisions
        run: |
          mkdir -p "$RUNNER_TEMP/xclipse-check"
          cp private/acnh/apk-app/aligned.apk "$RUNNER_TEMP/xclipse-check/unsigned.apk"
          (cd private/acnh/apk-app/assets/licenses && zip -qr "$RUNNER_TEMP/xclipse-check/licenses.zip" .)
          {
            printf 'Runtime: %s\n' "$(git rev-parse HEAD)"
            printf 'RADV Xclipse: %s\n' "$(git -C private/third_party/radv-xclipse rev-parse HEAD)"
            printf 'libadrenotools: %s\n' "$(git -C private/acnh/build-android-app/_deps/adrenotools-src rev-parse HEAD)"
            printf 'linkernsbypass: %s\n' "$(git -C private/acnh/build-android-app/_deps/adrenotools-src/lib/linkernsbypass rev-parse HEAD)"
            printf '%s\n' 'NDK: 29.0.14206865' 'Vulkan-Headers: 1.4.357' 'Dear ImGui: 1.91.9' \
              'RADV dependencies: libdrm 2.4.133, zlib 1.3.1, expat 2.5.0 (Meson wraps)'
          } > "$RUNNER_TEMP/xclipse-check/REVISIONS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xclipse-unsigned-check-apk
          path: ${{ runner.temp }}/xclipse-check/
          if-no-files-found: error
          retention-days: 7

  standalone-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test driver policy and cache identity
        run: |
          c++ -std=c++20 -Iruntime/src tests/android_driver_policy_test.cpp -o /tmp/driver-policy
          /tmp/driver-policy
          c++ -std=c++20 -Iruntime/src/nvn tests/pipeline_cache_identity_test.cpp -o /tmp/cache-identity
          /tmp/cache-identity
          c++ -std=c++20 -Iruntime/src/nvn tests/spirv_requirements_test.cpp -o /tmp/spirv-requirements
          /tmp/spirv-requirements
          python3 tests/adrenotools_patch_test.py
      - name: Test GPU selection and texture layout
        run: |
          c++ -std=c++20 -DNX_GPU_PICK_STANDALONE -Iruntime/src/nvn tests/gpu_pick_test.cpp runtime/src/nvn/nvn_gpu_pick.cpp -o /tmp/gpu-pick
          /tmp/gpu-pick
          c++ -std=c++20 -Iruntime/src/nvn tests/tiling_test.cpp runtime/src/nvn/nvn_tiling.cpp -o /tmp/tiling
          /tmp/tiling --selftest
          c++ -std=c++20 -Iruntime/src/nvn tests/astc_test.cpp runtime/src/nvn/nvn_astc.cpp -o /tmp/astc
          /tmp/astc --selftest

  release:
    if: github.event_name == 'push' && github.repository == 'ivanmatheus-dev/ACNHRecomp-Xclipse' && github.ref == 'refs/tags/xclipse-v0.1.0-experimental'
    needs: [android, standalone-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require tag to identify the current fork main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api repos/ivanmatheus-dev/ACNHRecomp-Xclipse/commits/main --jq .sha)
          test "$GITHUB_SHA" = "$main_sha"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xclipse-unsigned-check-apk
          path: ${{ runner.temp }}/xclipse-release
      - name: Install Android signing tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0' > /dev/null
          set -o pipefail
      - name: Sign and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          keyfile="$RUNNER_TEMP/xclipse-signing.jks"
          trap 'rm -f "$keyfile"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          cd "$RUNNER_TEMP/xclipse-release"
          apk=ACNHRecomp-Xclipse-v0.1.0-experimental.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$apk" unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/xclipse-release"
          cat > notes.txt <<'EOF'
          Build experimental para Android 14+ e Xclipse 960. O APK não inclui o jogo. A compatibilidade visual,
          estabilidade e desempenho no S26 ainda precisam de validação no aparelho. Faça backup dos saves.
          Consulte REVISIONS.txt e licenses.zip para as revisões e licenças; confira SHA256SUMS.txt após o download.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'ACNHRecomp Xclipse v0.1.0 experimental' --notes-file notes.txt \
            ACNHRecomp-Xclipse-v0.1.0-experimental.apk SHA256SUMS.txt licenses.zip REVISIONS.txt
